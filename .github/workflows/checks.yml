name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check homelab-hub/app/static/app.js
      - run: node --test homelab-hub/tests/frontend.test.cjs
      - run: python -m compileall -q homelab-hub/app
      - run: python -m unittest discover -s homelab-hub/tests
