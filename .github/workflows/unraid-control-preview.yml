name: Unraid Control preview
on:
  push:
    branches: [unraid-control-center]
    paths: ['unraid-control/**', '.github/workflows/unraid-control-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r unraid-control/requirements.txt playwright
      - run: python -m compileall -q unraid-control/control
      - run: node --check unraid-control/static/control.js
      - run: python -m unittest discover -s unraid-control/tests
      - run: playwright install --with-deps chromium
      - run: python unraid-control/tests/browser_control.py
      - run: python unraid-control/tests/browser_live.py
      - name: Verify production entry point
        working-directory: unraid-control
        run: |
          CONTROL_DATA="$RUNNER_TEMP/control-runtime" python -m uvicorn control.main:app --host 127.0.0.1 --port 8787 &
          task_pid=$!
          trap 'kill "$task_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/access > "$RUNNER_TEMP/control-access.json"; then
              python -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/control-access.json"))["setup"] is True'
              exit 0
            fi
            sleep 1
          done
          exit 1
  publish:
    needs: validate
    if: github.ref == 'refs/heads/unraid-control-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./unraid-control
          push: true
          tags: |
            ghcr.io/arnas1111/unraid-control-center:preview
            ghcr.io/arnas1111/unraid-control-center:preview-${{ github.sha }}
